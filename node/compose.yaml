# Local build + test composition for this repo: builds the app image from
# src/ and stands it up next to the mysql and redis service containers.
#
# Downstream repos do NOT use this file -- they copy the template under
# examples/, which pulls the published app image instead of building it.
name: devcontainer-node

services:
  app:
    build:
      context: ./src
      # Builds the dev target of node/src/Dockerfile, which also runs the shared
      # node-build stage (FROM BASE_IMAGE) -- so both tier images are needed.
      # BASE_IMAGE/DEV_IMAGE default to the published tiers; to build against
      # locally built tiers, run ../build-all.sh and set
      # BASE_IMAGE=devcontainer:base DEV_IMAGE=devcontainer:dev.
      # NODE_VERSION/PNPM_VERSION/VARIANT_TAG are REQUIRED (no defaults -- they
      # live only in variants.json). Pass them, e.g.:
      #   NODE_VERSION=22.22.3 PNPM_VERSION=10.33.0 VARIANT_TAG=node22 docker compose build
      # or just run ../build-all.sh, which reads variants.json for you.
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/carmendata/devcontainer:base}
        DEV_IMAGE: ${DEV_IMAGE:-ghcr.io/carmendata/devcontainer:dev}
        NODE_VERSION: ${NODE_VERSION:?set NODE_VERSION from node/variants.json, e.g. 24.16.0}
        PNPM_VERSION: ${PNPM_VERSION:?set PNPM_VERSION from node/variants.json}
        VARIANT_TAG: ${VARIANT_TAG:?set VARIANT_TAG to the variant name, e.g. node24}
    command: sleep infinity
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      # Dev sandbox only: passwordless root. Never use this in production.
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    # native password keeps the Debian `mysql` (MariaDB) client in the app
    # container able to connect with an empty password.
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    # persistence disabled -- the dev datastore is throwaway.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
