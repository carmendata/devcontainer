# Companion compose file for the devcontainer. Copy this file and
# devcontainer.json into a .devcontainer/ directory at the root of your repo.
#
# The app service pulls the published image; mysql and redis run as their own
# containers. From inside the devcontainer, reach them by service name:
# host "mysql" port 3306, host "redis" port 6379.
services:
  app:
    # Node major: edit this tag (node22 | node24). Each published image bakes a
    # reference copy of this file carrying its OWN tag, so CI re-copying it
    # preserves the major your repo runs rather than resetting it. See the README.
    image: ghcr.io/carmendata/devcontainer:node24
    # Always re-check the registry on `up` so the rolling tag refreshes to the
    # latest published build (Compose otherwise reuses a stale cached image).
    # Caveat: this FAILS the start if you're offline, even when a usable image
    # is cached -- drop this line (or set `missing`) if you need offline starts.
    pull_policy: always
    privileged: true        # required for in-container docker builds for CI
    command: sleep infinity
    volumes:
      - docker-data:/var/lib/docker   # non-overlay backing → in-container docker builds for CI
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    # GHCR mirror of the official Oracle MySQL image, version-pinned + frozen at
    # the source so `:8.0` only moves on a deliberate bump. Default pull policy
    # keeps a cached image -- you keep running the version you validated against.
    image: ghcr.io/carmendata/mysql:8.0
    environment:
      # Dev sandbox only: passwordless root. Never use this in production.
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 60 # some of the initdb scripts can take a while to run, so we need to be patient

  redis:
    # GHCR mirror, version-pinned + frozen the same way as mysql above.
    image: ghcr.io/carmendata/redis:7.4
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  docker-data: