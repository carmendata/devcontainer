# Companion compose file for the devcontainer. Copy this file and
# devcontainer.json into a .devcontainer/ directory at the root of your repo.
#
# The app service pulls the published image; mysql and redis run as their own
# containers. From inside the devcontainer, reach them by service name:
# host "mysql" port 3306, host "redis" port 6379.
name: my-project

services:
  app:
    # Pick the tag for your Node major -- node22 or node24 (see the project README).
    image: ghcr.io/carmendata/devcontainer:node24
    privileged: true        # required for in-container docker builds for CI
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - docker-data:/var/lib/docker   # non-overlay backing → in-container docker builds for CI
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      # Dev sandbox only: passwordless root. Never use this in production.
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  docker-data: