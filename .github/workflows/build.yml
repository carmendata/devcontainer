name: build

# Orchestrator: builds everything, in dependency order, by calling the tier
# workflows. Each tier's details live in its own file:
#   base.yml     -> carmendata/base         :latest           (call-only)
#   dev.yml      -> carmendata/dev          :latest           (call-only, FROM base by digest)
#   node.yml     -> carmendata/devcontainer :node22, :node24  (FROM base/dev by digest)
#                   carmendata/production   :node22, :node24  (FROM base by digest)
#   services.yml -> carmendata/mysql, redis, valkey, postgres (GHCR mirrors)
# Order: validate-variants -> base -> dev -> node, with services in parallel (no
# dependency); validate-variants fails a malformed node/variants.json before
# anything is published. The base/dev digests built in this run are passed
# down as workflow_call outputs, so a run is internally consistent. node.yml
# and services.yml can also be dispatched on their own
# (`make deploy TARGET=node|services`); base and dev are only ever rebuilt
# from here, together with the tiers above them.

on:
  # No push trigger: `git push` only saves work. Builds are triggered on demand
  # via workflow_dispatch (`make deploy`).
  workflow_dispatch:

# Never cancel a run in progress. The group must differ from every called
# workflow's group (base-/dev-/node-/services-<ref>), or the run deadlocks.
concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default. A called workflow cannot exceed its caller's token,
# so each calling job grants what the called jobs need. No `secrets: inherit`:
# only GITHUB_TOKEN is used; pass any future secret explicitly.
permissions:
  contents: read

jobs:
  # Fail fast: validate node/variants.json (the same script node.yml's
  # load-matrix runs) before base/dev are built and pushed, so a malformed file
  # publishes nothing.
  validate-variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate variants.json
        run: bash .github/scripts/load-variants.sh all

  base:
    needs: validate-variants
    uses: ./.github/workflows/base.yml
    permissions:
      contents: read
      packages: write
      id-token: write        # OIDC for keyless provenance attestation
      attestations: write    # write the build-provenance attestation to GHCR
      security-events: write # upload Trivy SARIF to the Security tab

  dev:
    needs: base
    uses: ./.github/workflows/dev.yml
    permissions:
      contents: read
      packages: write
      id-token: write        # OIDC for keyless provenance attestation
      attestations: write    # write the build-provenance attestation to GHCR
      security-events: write # upload Trivy SARIF to the Security tab
    with:
      base_digest: ${{ needs.base.outputs.digest }}

  node:
    needs: [base, dev]
    uses: ./.github/workflows/node.yml
    permissions:
      contents: read
      packages: write
      id-token: write        # OIDC for keyless provenance attestation
      attestations: write    # write the build-provenance attestation to GHCR
      security-events: write # upload Trivy SARIF to the Security tab
    with:
      base_digest: ${{ needs.base.outputs.digest }}
      dev_digest: ${{ needs.dev.outputs.digest }}
      variant: all

  services:
    uses: ./.github/workflows/services.yml
    permissions:
      contents: read
      packages: write
      id-token: write        # OIDC for keyless provenance attestation
      attestations: write    # write the build-provenance attestation to GHCR
      security-events: write # upload Trivy SARIF to the Security tab
    with:
      service: all
