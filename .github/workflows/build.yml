name: build

# Builds the three image tiers and pushes them all to GHCR:
#   base  -- minimal prod-capable debian (base/src)
#   dev   -- base + dev/CI tooling + docker engine (dev/src)
#   node  -- dev + a Node runtime per node/variants.json (node/src)
# Each tier is built FROM the immutable <tier>-<sha> tag produced earlier in the
# same run, so the run is internally consistent and the base/dev layers are
# shared across every variant in the registry.
#
# MySQL and Redis are not built here -- they are pulled from official images at
# devcontainer run time (see node/examples/compose.yaml).

on:
  push:
    branches: [main]
    paths:
      - 'base/**'
      - 'dev/**'
      - 'node/**'
      - '.github/workflows/build.yml'
  schedule:
    # Monday 04:00 UTC -- pick up base-image and OS security updates.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # One stack-agnostic package; the variant lives in the tag (base, node22,
  # node24, and later go, python, ...).
  IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer

jobs:
  # Build + push the shared base. Variants build FROM the immutable base-<sha>
  # tag produced here, so a run is internally consistent: variants always layer
  # on the base built from the same commit.
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets the amd64 runner also build the linux/arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive base ref
        id: ref
        run: echo "ref=${IMAGE}:base-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push base
        uses: docker/build-push-action@v6
        with:
          context: base/src
          file: base/src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Clean two-arch manifest list -- no extra attestation manifests,
          # which keeps the image predictable for podman / devcontainer tooling.
          provenance: false
          tags: |
            ${{ env.IMAGE }}:base
            ${{ steps.ref.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

  # Build + push the dev tooling tier FROM the base built above.
  dev:
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive dev ref
        id: ref
        run: echo "ref=${IMAGE}:dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push dev
        uses: docker/build-push-action@v6
        with:
          context: dev/src
          file: dev/src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ needs.base.outputs.ref }}
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ steps.ref.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

  # Turn node/variants.json into a build matrix.
  load-matrix:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.load.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
      - name: Load and validate variants.json
        id: load
        run: |
          jq -e '
            (.variants | length > 0)
            and ((.variants | map(.name) | length) == (.variants | map(.name) | unique | length))
            and ((.variants | map(.tags[]) | length) == (.variants | map(.tags[]) | unique | length))
          ' node/variants.json > /dev/null \
            || { echo "::error::node/variants.json is empty or has duplicate name/tag values"; exit 1; }
          echo "variants=$(jq -c '.variants' node/variants.json)" >> "$GITHUB_OUTPUT"

  node:
    needs: [dev, load-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.load-matrix.outputs.variants) }}
    name: ${{ matrix.variant.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rolling tags come from node/variants.json; the <name>-<sha> tag is the
      # immutable pin and is derived here.
      - name: Assemble tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            for t in $(echo '${{ toJSON(matrix.variant.tags) }}' | jq -r '.[]'); do
              echo "${IMAGE}:${t}"
            done
            echo "${IMAGE}:${{ matrix.variant.name }}-${GITHUB_SHA::7}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # devcontainer-metadata.json is kept out of the build context (see
      # node/src/.dockerignore) and applied as a label, so a metadata-only
      # change does not invalidate cached image layers.
      - name: Read devcontainer metadata
        id: dc_meta
        run: echo "json=$(jq -c . node/src/devcontainer-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: node/src
          file: node/src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            DEV_IMAGE=${{ needs.dev.outputs.ref }}
            NODE_VERSION=${{ matrix.variant.node }}
            PNPM_VERSION=${{ matrix.variant.pnpm }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            devcontainer.metadata=${{ steps.dc_meta.outputs.json }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,scope=${{ matrix.variant.name }},mode=max
