name: build node

# Builds every Node image variant declared in node/variants.json and pushes
# them to GHCR. MySQL and Redis are not built here -- they are pulled from
# official images at devcontainer run time (see node/compose.yaml), so this
# workflow only builds node/src/Dockerfile.

on:
  push:
    branches: [main]
    paths:
      - 'node/**'
      - '.github/workflows/build-node.yml'
  schedule:
    # Monday 04:00 UTC -- pick up base-image and OS security updates.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  # Workflow-specific so a future build-go.yml does not cancel this one.
  group: build-node-${{ github.ref }}
  cancel-in-progress: true

env:
  # One stack-agnostic package; the variant lives in the tag (node22, node24,
  # and later go, python, ...).
  IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer

jobs:
  # Turn node/variants.json into a build matrix.
  load-matrix:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.load.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
      - name: Load and validate variants.json
        id: load
        run: |
          jq -e '
            (.variants | length > 0)
            and ((.variants | map(.name) | length) == (.variants | map(.name) | unique | length))
            and ((.variants | map(.tags[]) | length) == (.variants | map(.tags[]) | unique | length))
          ' node/variants.json > /dev/null \
            || { echo "::error::node/variants.json is empty or has duplicate name/tag values"; exit 1; }
          echo "variants=$(jq -c '.variants' node/variants.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: load-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.load-matrix.outputs.variants) }}
    name: ${{ matrix.variant.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets the amd64 runner also build the linux/arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rolling tags come from node/variants.json; the <name>-<sha> tag is the
      # immutable pin and is derived here.
      - name: Assemble tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            for t in $(echo '${{ toJSON(matrix.variant.tags) }}' | jq -r '.[]'); do
              echo "${IMAGE}:${t}"
            done
            echo "${IMAGE}:${{ matrix.variant.name }}-${GITHUB_SHA::7}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # devcontainer-metadata.json is kept out of the build context (see
      # node/src/.dockerignore) and applied as a label, so a metadata-only
      # change does not invalidate cached image layers.
      - name: Read devcontainer metadata
        id: dc_meta
        run: echo "json=$(jq -c . node/src/devcontainer-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: node/src
          file: node/src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Clean two-arch manifest list -- no extra attestation manifests,
          # which keeps the image predictable for podman / devcontainer tooling.
          provenance: false
          build-args: |
            NODE_VARIANT=${{ matrix.variant.node }}
            PNPM_VERSION=${{ matrix.variant.pnpm }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            devcontainer.metadata=${{ steps.dc_meta.outputs.json }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,scope=${{ matrix.variant.name }},mode=max
