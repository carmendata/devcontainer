name: verify-image
description: >
  Post-push image hardening: scan a published image for vulnerabilities/secrets
  (Trivy, results -> Security tab) and attest its build provenance (keyless SLSA
  via OIDC, pushed to GHCR). Call once per pushed image, by digest. The calling
  job must grant: packages: write, id-token: write, attestations: write,
  security-events: write -- and must already be logged in to the registry.
inputs:
  image:
    description: Image name without tag/digest, e.g. ghcr.io/owner/mysql
    required: true
  digest:
    description: Image digest (sha256:...) emitted by docker/build-push-action
    required: true
  category:
    description: Unique SARIF category so parallel matrix scans do not collide
    required: true
  enforce:
    description: "'true' fails the job on CRITICAL/HIGH; 'false' = report-only"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache Trivy DB
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/trivy
        key: ${{ runner.os }}-trivy-db-v1
        restore-keys: |
          ${{ runner.os }}-trivy-db-

    - name: Trivy vulnerability + secret scan
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        cache-dir: ~/.cache/trivy
        image-ref: ${{ inputs.image }}@${{ inputs.digest }}
        format: sarif
        output: trivy-${{ inputs.category }}.sarif
        severity: CRITICAL,HIGH
        scanners: vuln,secret
        ignore-unfixed: "true"
        # report-only by default; flip `enforce` to fail the build on findings
        exit-code: ${{ inputs.enforce == 'true' && '1' || '0' }}
    - name: Upload scan results to the Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
      with:
        sarif_file: trivy-${{ inputs.category }}.sarif
        category: ${{ inputs.category }}
    - name: Attest build provenance (keyless, SLSA)
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: true
